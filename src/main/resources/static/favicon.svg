<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    favicon 专用简化图标：方图、粗形状。
    完整版品牌标识见 logo-mark.svg / logo.svg；
    这版去掉细节描边与小圆点，保证在 16px 浏览器标签上仍然清晰。
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <polygon points="32,13 49,23 32,51 15,23" fill="#ffffff"/>
  <polygon points="32,23 40,27.5 32,43 24,27.5" fill="#4f46e5" opacity="0.38"/>
</svg>