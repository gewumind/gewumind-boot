<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ====== 图标区域 ====== -->
  <g transform="translate(18, 16)">
    <!-- 外层六边形 -->
    <polygon points="40,0 74,12 74,52 40,64 6,52 6,12"
             fill="none" stroke="url(#g)" stroke-width="2.5" opacity="0.25"/>

    <!-- 核心菱形 -->
    <polygon points="40,4 68,18 40,60 12,18"
             fill="url(#g)" filter="url(#shadow)"/>

    <!-- 菱形内部镂空三角形（"智"的象征） -->
    <polygon points="40,14 56,24 40,48 24,24"
             fill="#fff" opacity="0.15"/>

    <!-- 中心发光点 -->
    <circle cx="40" cy="24" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="40" cy="24" r="8" fill="#fff" opacity="0.15"/>

    <!-- 三个节点（格物→致知） -->
    <circle cx="28" cy="12" r="2.5" fill="#818cf8" opacity="0.6"/>
    <circle cx="56" cy="12" r="2.5" fill="#818cf8" opacity="0.6"/>
    <circle cx="40" cy="50" r="2.5" fill="#818cf8" opacity="0.6"/>

    <!-- 节点连线 -->
    <line x1="28" y1="12" x2="40" y2="24" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
    <line x1="56" y1="12" x2="40" y2="24" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="48" x2="40" y2="24" stroke="#818cf8" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ====== 文字区域 ====== -->
  <g transform="translate(110, 0)">
    <!-- GewuMind -->
    <text x="0" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" letter-spacing="0.5">
      <tspan fill="#1e1b4b">Gewu</tspan><tspan fill="url(#g)">Mind</tspan>
    </text>

    <!-- tagline -->
    <text x="2" y="73" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#a5b4fc" letter-spacing="3">
      WISDOM THROUGH KNOWLEDGE
    </text>

    <!-- 格物智 -->
    <text x="2" y="94" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#6366f1" letter-spacing="5">
      格物智
    </text>
  </g>
</svg>
